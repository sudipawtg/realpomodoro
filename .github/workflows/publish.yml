name: Package Chrome extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    uses: sudipawtg/real-cws-workflows/.github/workflows/publish-chrome-extension.yml@v1
    with:
      package_command: bash scripts/package-extension.sh
      artifact_glob: dist/*.zip
      manifest_path: manifest.json
      node_version: ''
